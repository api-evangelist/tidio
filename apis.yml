description: >
  Tidio is a customer service platform used by over 300,000 businesses that
  combines live chat, AI-powered chatbots (Lyro AI), and email ticketing into a
  unified support workspace. The platform exposes a REST OpenAPI for managing
  contacts, conversations, and tickets, a Webhooks system for real-time event
  notifications, and a JavaScript Widget SDK for front-end customization. API
  access uses paired client-id and client-secret headers and is gated by plan
  tier, with full OpenAPI access available on Plus and Premium plans. Rate
  limits range from 10 requests per minute on entry plans to 120 requests per
  minute on Premium. Tidio also offers an AI automation product called Flows
  for proactive visitor engagement via a no-code builder.
